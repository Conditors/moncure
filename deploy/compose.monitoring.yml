x-monitoring-service: &monitoring-service
  image: monitoring-service:local
  build:
    context: ../monitoring-service
  env_file:
    - ../monitoring-service/.env
  environment:
    MONITORING_POSTGRES_HOST: monitoring-db
    MONITORING_POSTGRES_PORT: 5432
  restart: unless-stopped


services:
  monitoring-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${MONITORING_POSTGRES_USER}
      POSTGRES_PASSWORD: ${MONITORING_POSTGRES_PASSWORD}
      POSTGRES_DB: ${MONITORING_POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - monitoring_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MONITORING_POSTGRES_USER} -d ${MONITORING_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  monitoring-migrate:
    <<: *monitoring-service
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      monitoring-db:
        condition: service_healthy
    restart: "no"

  monitoring-outbox:
    <<: *monitoring-service
    command: ["python", "-m", "monitoring_service.entrypoints.publisher"]
    environment:
      MONITORING_POSTGRES_HOST: monitoring-db
      MONITORING_POSTGRES_PORT: "5432"
      MONITORING_RABBITMQ_HOST: rabbitmq
      MONITORING_RABBITMQ_PORT: "5672"
    
    depends_on:
      monitoring-migrate:
        condition: service_completed_successfully
      
      rabbitmq:
        condition: service_healthy

volumes:
  monitoring_postgres_data:
